<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Field Marker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12181f">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#12181f;
    --panel:#1a222c;
    --panel-2:#212b37;
    --line:#2b3644;
    --text:#e7ecf1;
    --dim:#8a97a6;
    --accent:#5fe3a1;
    --accent-dim:#3a8f68;
    --warn:#e3925f;
    --danger:#e35f5f;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent;}
  body{padding:14px;padding-bottom:40px;}

  .wrap{max-width:340px;margin:0 auto;}

  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  header h1{font-size:15px;font-weight:600;letter-spacing:.02em;margin:0;}
  header .badge{font-family:var(--mono);font-size:10px;color:var(--dim);}
  .header-right{display:flex;align-items:center;gap:8px;}

  /* numbers/coords/timestamps must never visually reorder, regardless of
     page text direction — isolate them as their own LTR run */
  .ltr-num{direction:ltr;unicode-bidi:isolate;}

  /* ---- language switcher: closed pill + drop-down list, tap to pick ---- */
  .lang-switch{position:relative;}
  .lang-current{display:flex;align-items:center;gap:3px;background:var(--panel-2);
    border:1px solid var(--line);color:var(--text);font-family:var(--mono);font-size:10px;
    font-weight:600;letter-spacing:.03em;padding:5px 7px;border-radius:7px;}
  .lang-current:active{background:#26313e;}
  .lang-current svg{width:10px;height:10px;transition:transform .15s;}
  .lang-switch.open .lang-current svg{transform:rotate(180deg);}
  .lang-switch.open .lang-current{border-color:var(--accent-dim);}
  .lang-menu{position:absolute;top:calc(100% + 4px);inset-inline-end:0;min-width:56px;
    background:var(--panel-2);border:1px solid var(--line);border-radius:9px;overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,.35);z-index:40;display:none;flex-direction:column;}
  .lang-switch.open .lang-menu{display:flex;}
  .lang-opt{width:100%;background:var(--panel);color:var(--text);font-family:var(--mono);
    font-size:12px;font-weight:600;padding:9px 0;text-align:center;border-bottom:1px solid var(--line);}
  .lang-opt:last-child{border-bottom:none;}
  .lang-opt:active{background:#26313e;}
  .lang-opt.active{background:var(--accent);color:#0f1620;}

  html[dir="rtl"] .vf-status{left:auto;right:6px;}
  html[dir="rtl"] .lightbox .lb-close{right:auto;left:16px;}
  html[dir="rtl"] .dot{margin-right:0;margin-left:5px;}
  html[dir="rtl"] input[type=text]{direction:ltr;text-align:right;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;}

  /* deliberately small viewfinder, not fullscreen */
  .viewfinder{position:relative;width:100%;aspect-ratio:4/3;background:#000;border-radius:7px;
    overflow:hidden;border:1px solid var(--line);}
  .viewfinder video{width:100%;height:100%;object-fit:cover;display:block;}
  .viewfinder canvas{display:none;}
  .vf-crosshair{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;}
  .vf-crosshair svg{width:26px;height:26px;opacity:.55;}
  .vf-status{position:absolute;left:6px;bottom:6px;font-family:var(--mono);font-size:9px;
    background:rgba(0,0,0,.55);color:var(--accent);padding:2px 6px;border-radius:4px;}
  .vf-off{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--dim);font-size:11px;text-align:center;padding:16px;}

  .row{display:flex;gap:8px;}
  .row + .row{margin-top:8px;}

  label{display:block;font-size:10px;color:var(--dim);letter-spacing:.03em;text-transform:uppercase;margin-bottom:4px;}
  input[type=text]{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    border-radius:6px;padding:8px 9px;font-size:14px;font-family:var(--mono);}
  input[type=text]:focus{outline:none;border-color:var(--accent-dim);}

  .field{flex:1;}

  button{font:inherit;cursor:pointer;border:none;border-radius:7px;}
  .btn{background:var(--panel-2);color:var(--text);border:1px solid var(--line);padding:9px 10px;font-size:12px;}
  .btn:active{background:#26313e;}
  .btn-ghost{background:transparent;color:var(--dim);border:1px solid var(--line);padding:6px 9px;font-size:11px;}

  .shutter-row{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:10px;}
  .shutter{width:58px;height:58px;border-radius:50%;background:var(--accent);border:3px solid #0e140019;
    box-shadow:0 0 0 3px var(--panel-2), 0 0 0 4px var(--line);display:flex;align-items:center;justify-content:center;}
  .shutter:active{transform:scale(.94);}
  .shutter:disabled{background:var(--dim);opacity:.5;}
  .shutter svg{width:22px;height:22px;}

  .gps-line{font-family:var(--mono);font-size:11px;color:var(--dim);display:flex;justify-content:space-between;}
  .gps-line b{color:var(--text);font-weight:500;}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;}
  .dot.ok{background:var(--accent);}
  .dot.wait{background:var(--warn);animation:pulse 1.2s infinite;}
  .dot.bad{background:var(--danger);}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  .log{max-height:220px;overflow-y:auto;}
  .log-empty{color:var(--dim);font-size:12px;text-align:center;padding:16px 0;}
  .log-item{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);align-items:center;}
  .log-item:last-child{border-bottom:none;}
  .log-thumb{width:38px;height:38px;border-radius:5px;object-fit:cover;flex-shrink:0;background:#000;}
  .log-meta{flex:1;min-width:0;}
  .log-ref{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .log-coords{font-family:var(--mono);font-size:10px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .log-actions{display:flex;gap:4px;}
  .icon-btn{background:var(--panel-2);border:1px solid var(--line);color:var(--dim);width:26px;height:26px;
    border-radius:5px;display:flex;align-items:center;justify-content:center;}
  .icon-btn svg{width:13px;height:13px;}

  .toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,0);background:var(--panel-2);
    border:1px solid var(--accent-dim);color:var(--accent);padding:8px 14px;border-radius:20px;font-size:12px;
    opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;z-index:50;}
  .toast.show{opacity:1;transform:translate(-50%,-4px);}

  .footer-actions{display:flex;gap:8px;margin-top:2px;}
  .footer-actions .btn{flex:1;text-align:center;}

  .toggle{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);}
  .toggle input{accent-color:var(--accent);}

  .lightbox{position:fixed;inset:0;background:rgba(6,9,13,.94);z-index:70;display:none;
    align-items:center;justify-content:center;flex-direction:column;padding:22px;}
  .lightbox.show{display:flex;}
  .lightbox img{max-width:100%;max-height:78vh;border-radius:8px;border:1px solid var(--line);}
  .lightbox .lb-caption{font-family:var(--mono);font-size:12px;color:var(--dim);margin-top:12px;text-align:center;}
  .lightbox .lb-caption b{color:var(--accent);}
  .lightbox .lb-close{position:absolute;top:16px;right:16px;background:var(--panel-2);
    border:1px solid var(--line);color:var(--text);width:34px;height:34px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;}
  .lightbox .lb-close svg{width:16px;height:16px;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1 id="appTitle">Field Marker</h1>
    <div class="header-right">
      <span class="badge ltr-num" id="clock">--:--:--</span>
      <div class="lang-switch" id="langSwitch">
        <button class="lang-current" id="langCurrentBtn" type="button" aria-haspopup="listbox" aria-expanded="false">
          <span id="langCurrentLabel">EN</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="lang-menu" id="langMenu" role="listbox">
          <button class="lang-opt active" type="button" data-lang="en" role="option" aria-selected="true">EN</button>
          <button class="lang-opt" type="button" data-lang="ar" role="option" aria-selected="false">ع</button>
        </div>
      </div>
    </div>
  </header>

  <div class="card">
    <div class="viewfinder" id="vfBox">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas"></canvas>
      <div class="vf-crosshair">
        <svg viewBox="0 0 24 24" fill="none" stroke="#5fe3a1" stroke-width="1.4">
          <circle cx="12" cy="12" r="7"/><line x1="12" y1="1" x2="12" y2="6"/>
          <line x1="12" y1="18" x2="12" y2="23"/><line x1="1" y1="12" x2="6" y2="12"/>
          <line x1="18" y1="12" x2="23" y2="12"/>
        </svg>
      </div>
      <div class="vf-status" id="vfStatus">starting camera…</div>
      <div class="vf-off" id="vfOff" style="display:none;"></div>
    </div>
  </div>

  <div class="card">
    <div class="gps-line">
      <span><span class="dot wait" id="gpsDot"></span><span id="gpsLabel">GPS</span></span>
      <b id="gpsText" class="ltr-num">acquiring…</b>
    </div>
    <div class="row" style="margin-top:6px;">
      <button class="btn-ghost" id="retryGpsBtn" style="flex:1;">Retry GPS lock</button>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <div class="field">
        <label id="refLabel">Reference No. (optional)</label>
        <input type="text" id="refInput" placeholder="e.g. 014" inputmode="text">
      </div>
    </div>
    <div class="row" style="margin-top:8px;">
      <label class="toggle"><input type="checkbox" id="autoInc" checked> <span id="autoIncLabel">Auto-increment after capture</span></label>
    </div>

    <div class="shutter-row">
      <button class="shutter" id="shutterBtn" disabled title="Capture">
        <svg viewBox="0 0 24 24" fill="none" stroke="#0f1620" stroke-width="2">
          <path d="M9 3h6l2 3h3a1 1 0 011 1v11a1 1 0 01-1 1H4a1 1 0 01-1-1V7a1 1 0 011-1h3l2-3z"/>
          <circle cx="12" cy="13" r="3.4"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:6px;">
      <label style="margin:0;"><span id="capturedLabel">Captured</span> (<span id="logCount" class="ltr-num">0</span>)</label>
      <div style="display:flex;gap:6px;">
        <button class="btn-ghost" id="exportBtn">Export CSV</button>
        <button class="btn-ghost" id="clearBtn">Clear</button>
      </div>
    </div>
    <div class="log" id="log">
      <div class="log-empty" id="logEmptyMsg">No photos captured yet.</div>
    </div>
  </div>

  <div class="footer-actions">
    <button class="btn" id="downloadAllBtn">Save all photos as .zip</button>
  </div>

</div>

<div class="toast" id="toast"></div>

<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose" title="Close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <img id="lbImg" src="" alt="Captured photo">
  <div class="lb-caption" id="lbCaption"></div>
</div>

<script src="piexif.js"></script>
<script src="jszip.min.js"></script>
<script>
(function(){
  "use strict";

  // ---------- state ----------
  var STORE_KEY = "fieldmarker_log_v1";
  var entries = [];          // {id, ref, lat, lon, acc, alt, ts, filename, dataUrl}
  var stream = null;
  var lastPosition = null;
  var geoWatchId = null;
  var videoReady = false;

  var video = document.getElementById("video");
  var canvas = document.getElementById("canvas");
  var vfStatus = document.getElementById("vfStatus");
  var vfOff = document.getElementById("vfOff");
  var gpsDot = document.getElementById("gpsDot");
  var gpsText = document.getElementById("gpsText");
  var refInput = document.getElementById("refInput");
  var autoInc = document.getElementById("autoInc");
  var shutterBtn = document.getElementById("shutterBtn");
  var logEl = document.getElementById("log");
  var logCount = document.getElementById("logCount");
  var toast = document.getElementById("toast");
  var clock = document.getElementById("clock");

  // ---------- i18n ----------
  // Only interface copy is translated. Numbers, coordinates and timestamps
  // are always rendered as plain Western digits, in their normal left-to-
  // right order — they're wrapped in .ltr-num (or drawn as isolated runs on
  // the canvas) so they never get caught up in the Arabic right-to-left
  // reordering and come out mirrored/rearranged.
  var LANG_KEY = "fieldmarker_lang_v1";
  var STR = {
    en: {
      appTitle: "Field Marker",
      gpsLabel: "GPS",
      retryGps: "Retry GPS lock",
      refLabel: "Reference No. (optional)",
      refPlaceholder: "e.g. 014",
      autoIncLabel: "Auto-increment after capture",
      capturedLabel: "Captured",
      exportBtn: "Export CSV",
      clearBtn: "Clear",
      logEmpty: "No photos captured yet.",
      downloadAllBtn: "Save all photos as .zip",
      shutterTitle: "Capture",
      lbCloseTitle: "Close",
      vfStarting: "starting camera…",
      vfLive: "live",
      vfUnsupported: "camera API unsupported",
      vfBlocked: "camera blocked",
      vfOffUnsupportedMsg: "This browser doesn't support camera access.",
      vfOffBlockedMsg: "Camera permission denied or unavailable. Enable camera access in browser/site settings and reload.",
      gpsAcquiring: "acquiring…",
      gpsNeedsHttps: "needs https",
      gpsUnsupported: "unsupported",
      gpsDenied: "permission denied",
      gpsUnavailable: "position unavailable",
      gpsRetrying: "no fix yet — retrying",
      toastHttps: "Open via your https:// URL, not a local file, for GPS to work",
      toastLocation: "Check phone Location is ON, and site location permission is Allow",
      toastCameraPerm: "Camera permission needed",
      toastCamNotReady: "Camera not ready — wait a moment",
      toastFrameBlank: "Frame looked blank — try again",
      toastSavedGps: "Saved — GPS locked",
      toastSavedNoGps: "Saved — no GPS fix",
      toastNothingExport: "Nothing to export",
      toastNothingSave: "Nothing to save",
      toastZipLibFail: "Zip library failed to load — reload the app",
      toastZipping: function(n){ return "Zipping " + n + " photo(s)…"; },
      toastZipSaved: function(n){ return "Saved " + n + " photo(s) as a zip"; },
      toastZipFailed: "Zip failed — try again",
      toastStorageOpenFail: "Couldn't open storage — photos won't be saved this session",
      toastStorageFull: "Storage full — export & clear log",
      toastStorageSaveFail: "Couldn't save — export your photos soon",
      refPrefix: "Ref",
      noRef: "(no ref)",
      noGpsFix: "no GPS fix",
      thisPhoto: "this photo",
      photoRef: function(ref){ return "photo Ref " + ref; },
      deleteConfirmPhoto: function(label){ return "Delete " + label + "? This can't be undone."; },
      deleteConfirmAll: function(n){ return "Delete all " + n + " logged photos? This can't be undone."; },
      viewTitle: "View photo",
      deleteTitle: "Delete",
      watermarkRef: "REF",
      watermarkNoGps: "NO GPS FIX"
    },
    ar: {
      appTitle: "علامة الحقل",
      gpsLabel: "GPS",
      retryGps: "إعادة محاولة تثبيت GPS",
      refLabel: "الرقم المرجعي (اختياري)",
      refPlaceholder: "مثال: 014",
      autoIncLabel: "زيادة الرقم تلقائيًا بعد كل صورة",
      capturedLabel: "الصور الملتقطة",
      exportBtn: "تصدير CSV",
      clearBtn: "مسح",
      logEmpty: "لم يتم التقاط أي صور بعد.",
      downloadAllBtn: "حفظ جميع الصور كملف ‎.zip",
      shutterTitle: "التقاط",
      lbCloseTitle: "إغلاق",
      vfStarting: "جارٍ تشغيل الكاميرا…",
      vfLive: "مباشر",
      vfUnsupported: "الكاميرا غير مدعومة",
      vfBlocked: "الكاميرا محظورة",
      vfOffUnsupportedMsg: "هذا المتصفح لا يدعم الوصول إلى الكاميرا.",
      vfOffBlockedMsg: "تم رفض إذن الكاميرا أو أنه غير متاح. فعّل الوصول إلى الكاميرا من إعدادات المتصفح أو الموقع ثم أعد التحميل.",
      gpsAcquiring: "جارٍ التحديد…",
      gpsNeedsHttps: "يتطلب https",
      gpsUnsupported: "غير مدعوم",
      gpsDenied: "تم رفض الإذن",
      gpsUnavailable: "الموقع غير متاح",
      gpsRetrying: "لا يوجد تثبيت بعد — إعادة المحاولة",
      toastHttps: "افتح التطبيق عبر رابط https:// وليس كملف محلي حتى يعمل GPS",
      toastLocation: "تأكد أن خدمة الموقع في الهاتف مفعّلة وأن إذن الموقع للموقع مضبوط على السماح",
      toastCameraPerm: "إذن الكاميرا مطلوب",
      toastCamNotReady: "الكاميرا غير جاهزة — انتظر لحظة",
      toastFrameBlank: "الإطار يبدو فارغًا — حاول مرة أخرى",
      toastSavedGps: "تم الحفظ — تم تثبيت GPS",
      toastSavedNoGps: "تم الحفظ — بدون إشارة GPS",
      toastNothingExport: "لا يوجد شيء للتصدير",
      toastNothingSave: "لا يوجد شيء للحفظ",
      toastZipLibFail: "فشل تحميل مكتبة الضغط — أعد تحميل التطبيق",
      toastZipping: function(n){ return "جارٍ ضغط " + n + " صورة…"; },
      toastZipSaved: function(n){ return "تم حفظ " + n + " صورة كملف مضغوط"; },
      toastZipFailed: "فشل الضغط — حاول مرة أخرى",
      toastStorageOpenFail: "تعذّر فتح مساحة التخزين — لن يتم حفظ الصور في هذه الجلسة",
      toastStorageFull: "التخزين ممتلئ — صدّر السجل ثم امسحه",
      toastStorageSaveFail: "تعذّر الحفظ — صدّر صورك قريبًا",
      refPrefix: "مرجع",
      noRef: "(بدون مرجع)",
      noGpsFix: "بدون إشارة GPS",
      thisPhoto: "هذه الصورة",
      photoRef: function(ref){ return "الصورة ذات المرجع " + ref; },
      deleteConfirmPhoto: function(label){ return "حذف " + label + "؟ لا يمكن التراجع عن هذا."; },
      deleteConfirmAll: function(n){ return "حذف جميع الصور المسجّلة (" + n + ")؟ لا يمكن التراجع عن هذا."; },
      viewTitle: "عرض الصورة",
      deleteTitle: "حذف",
      watermarkRef: "مرجع",
      watermarkNoGps: "بدون GPS"
    }
  };
  var LANG = "en";
  try{
    var savedLang = localStorage.getItem(LANG_KEY);
    if(savedLang === "en" || savedLang === "ar") LANG = savedLang;
  }catch(e){}

  function t(key){
    return STR[LANG][key];
  }

  // Wraps a numeric/coordinate/timestamp substring in Unicode isolate marks
  // so it always renders left-to-right and in its original order, even when
  // it sits inside an Arabic (right-to-left) sentence or a plain native
  // dialog like confirm(). This is what stops numbers from getting visually
  // reordered/mirrored in RTL mode.
  function ltr(s){ return "\u2066" + s + "\u2069"; }

  // Tracks live status so screens can be re-rendered in the new language
  // immediately after a language switch, without waiting for the next
  // camera/GPS event.
  var cameraState = "starting";   // starting | live | unsupported | blocked
  var gpsState = { kind: "wait" }; // wait | https | unsupported | ok | denied | unavailable | retrying

  function renderCameraUI(){
    if(cameraState === "starting") vfStatus.textContent = t("vfStarting");
    else if(cameraState === "live") vfStatus.textContent = t("vfLive");
    else if(cameraState === "unsupported"){
      vfStatus.textContent = t("vfUnsupported");
      vfOff.style.display = "flex";
      vfOff.textContent = t("vfOffUnsupportedMsg");
    }else if(cameraState === "blocked"){
      vfStatus.textContent = t("vfBlocked");
      vfOff.style.display = "flex";
      vfOff.textContent = t("vfOffBlockedMsg");
    }
  }

  function renderGpsUI(){
    if(gpsState.kind === "wait"){
      gpsDot.className = "dot wait"; gpsText.textContent = t("gpsAcquiring");
    }else if(gpsState.kind === "https"){
      gpsDot.className = "dot bad"; gpsText.textContent = t("gpsNeedsHttps");
    }else if(gpsState.kind === "unsupported"){
      gpsDot.className = "dot bad"; gpsText.textContent = t("gpsUnsupported");
    }else if(gpsState.kind === "ok"){
      gpsDot.className = "dot ok";
      gpsText.textContent = gpsState.lat.toFixed(6) + ", " + gpsState.lon.toFixed(6) + "  ±" + Math.round(gpsState.acc) + "m";
    }else if(gpsState.kind === "denied"){
      gpsDot.className = "dot bad"; gpsText.textContent = t("gpsDenied");
    }else if(gpsState.kind === "unavailable"){
      gpsDot.className = "dot bad"; gpsText.textContent = t("gpsUnavailable");
    }else if(gpsState.kind === "retrying"){
      gpsDot.className = "dot bad"; gpsText.textContent = t("gpsRetrying");
    }
  }

  function applyStaticStrings(){
    document.getElementById("appTitle").textContent = t("appTitle");
    document.getElementById("gpsLabel").textContent = t("gpsLabel");
    document.getElementById("retryGpsBtn").textContent = t("retryGps");

  // ---------- persistence ----------
  // Photos are stored in IndexedDB rather than localStorage — localStorage
  // caps out around 5-10MB per site, which is only a handful of full-size
  // photos; IndexedDB doesn't have that small cap (normally hundreds of MB+,
  // tied to actual free device space). Falls back to localStorage on very
  // old browsers, and migrates any existing localStorage log in once.
  var DB_NAME = "fieldmarker_idb";
  var DB_STORE = "store";
  var hasIDB = "indexedDB" in window;

  function openDB(){
    return new Promise(function(resolve, reject){
      var req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function(ev){
        var d = ev.target.result;
        if(!d.objectStoreNames.contains(DB_STORE)) d.createObjectStore(DB_STORE);
      };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
    });
  }
  function idbGet(key){
    return openDB().then(function(d){
      return new Promise(function(resolve, reject){
        var tx = d.transaction(DB_STORE, "readonly");
        var r = tx.objectStore(DB_STORE).get(key);
        r.onsuccess = function(){ resolve(r.result); };
        r.onerror = function(){ reject(r.error); };
      });
    });
  }
  function idbSet(key, value){
    return openDB().then(function(d){
      return new Promise(function(resolve, reject){
        var tx = d.transaction(DB_STORE, "readwrite");
        tx.objectStore(DB_STORE).put(value, key);
        tx.oncomplete = function(){ resolve(); };
        tx.onerror = function(){ reject(tx.error); };
      });
    });
  }
  function idbDelete(key){
    return openDB().then(function(d){
      return new Promise(function(resolve, reject){
        var tx = d.transaction(DB_STORE, "readwrite");
        tx.objectStore(DB_STORE).delete(key);
        tx.oncomplete = function(){ resolve(); };
        tx.onerror = function(){ reject(tx.error); };
      });
    });
  }

  function loadLog(){
    if(!hasIDB){
      try{
        var raw = localStorage.getItem(STORE_KEY);
        entries = raw ? JSON.parse(raw) : [];
      }catch(e){ entries = []; }
      renderLog();
      return;
    }
    idbGet(STORE_KEY).then(function(val){
      if(val && val.length){
        entries = val;
        renderLog();
        return;
      }
      // Nothing in IndexedDB yet — check for an old localStorage log from
      // a previous version of the app and migrate it in, once.
      var migrated = [];
      try{
        var raw = localStorage.getItem(STORE_KEY);
        migrated = raw ? JSON.parse(raw) : [];
      }catch(e){ migrated = []; }
      entries = migrated;
      renderLog();
      if(migrated.length) saveLog();
    }).catch(function(){
      entries = [];
      renderLog();
      showToast(t("toastStorageOpenFail"));
    });
  }
  function saveLog(){
    if(!hasIDB){
      try{ localStorage.setItem(STORE_KEY, JSON.stringify(entries)); }
      catch(e){ showToast(t("toastStorageFull")); }
      return;
    }
    idbSet(STORE_KEY, entries).catch(function(){
      showToast(t("toastStorageSaveFail"));
    });
  }

  // ---------- camera ----------
  var imageCapture = null;

  async function startCamera(){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      cameraState = "unsupported";
      renderCameraUI();
      return;
    }
    try{
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" }, width:{ideal:1920}, height:{ideal:1440} },
        audio: false
      });
      video.srcObject = stream;
      try{ await video.play(); }catch(e){ /* will retry on canplay below */ }

      // ImageCapture lets us pull a full-resolution still from the sensor
      // (much sharper than the live preview stream) when the browser
      // supports it — used for capture(), not for the preview itself.
      try{
        var track = stream.getVideoTracks()[0];
        if(track && "ImageCapture" in window){
          imageCapture = new ImageCapture(track);
        }
        // Ask for continuous autofocus where supported — helps sharpness
        // when photographing text/labels up close.
        if(track && track.getCapabilities){
          var caps = track.getCapabilities();
          if(caps && caps.focusMode && caps.focusMode.indexOf("continuous") !== -1){
            track.applyConstraints({ advanced: [{ focusMode: "continuous" }] }).catch(function(){});
          }
        }
      }catch(e){ imageCapture = null; }

      videoReady = false;
      video.addEventListener("loadeddata", markVideoReady);
      video.addEventListener("canplay", markVideoReady);
      // Fallback in case events already fired before listeners attached
      if(video.readyState >= 2) markVideoReady();

      cameraState = "live";
      renderCameraUI();

    }catch(err){
      cameraState = "blocked";
      renderCameraUI();
      showToast(t("toastCameraPerm"));
    }
  }

  function markVideoReady(){
    if(videoReady) return;
    videoReady = true;
    shutterBtn.disabled = false;
  }

  // If the preview is ever stuck, a tap anywhere resumes it — cheap,
  // simple, no background timers running constantly.
  function touchNudge(){
    if(stream && video.paused){ video.play().catch(function(){}); }
  }
  document.addEventListener("touchstart", touchNudge, { passive: true });
  document.addEventListener("pointerdown", touchNudge);

  // Resume the camera feed if the page was backgrounded (common on mobile —
  // browsers pause the video element and it can come back showing a stale
  // black frame until play() is called again).
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible" && stream && video.paused){
      video.play().catch(function(){});
    }
  });

  // ---------- geolocation ----------
  function startGeo(){
    if(!window.isSecureContext){
      gpsState = { kind: "https" };
      renderGpsUI();
      showToast(t("toastHttps"));
      return;
    }
    if(!navigator.geolocation){
      gpsState = { kind: "unsupported" };
      renderGpsUI();
      return;
    }
    gpsState = { kind: "wait" };
    renderGpsUI();
    if(geoWatchId != null){ navigator.geolocation.clearWatch(geoWatchId); }
    geoWatchId = navigator.geolocation.watchPosition(function(pos){
      lastPosition = pos;
      var c = pos.coords;
      gpsState = { kind: "ok", lat: c.latitude, lon: c.longitude, acc: c.accuracy };
      renderGpsUI();
    }, function(err){
      if(err.code === 1){
        gpsState = { kind: "denied" };
        showToast(t("toastLocation"));
      }else if(err.code === 2){
        gpsState = { kind: "unavailable" };
      }else{
        gpsState = { kind: "retrying" };
      }
      renderGpsUI();
    }, {
      enableHighAccuracy: true,
      maximumAge: 2000,
      timeout: 30000
    });
  }

  // ---------- capture ----------
  function nextAutoRef(){
    var maxN = 0;
    entries.forEach(function(e){
      var n = parseInt(e.ref, 10);
      if(!isNaN(n) && n > maxN) maxN = n;
    });
    return String(maxN + 1);
  }

  function toDMS(deg){
    var d = Math.floor(deg);
    var minFloat = (deg - d) * 60;
    var m = Math.floor(minFloat);
    var s = (minFloat - m) * 60;
    // piexif wants [[num,den],[num,den],[num,den]]
    return [[d,1],[m,1],[Math.round(s*100),100]];
  }

  // ---------- Tunisia local time helpers ----------
  // Africa/Tunis is fixed at UTC+1 year-round (no DST since 2009), but we
  // still resolve it via Intl so this stays correct regardless of the
  // device's own timezone/locale settings.
  function tunisiaParts(date){
    var fmt = new Intl.DateTimeFormat("en-GB", {
      timeZone: "Africa/Tunis", hourCycle: "h23",
      year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", second: "2-digit"
    });
    var out = {};
    fmt.formatToParts(date).forEach(function(p){ out[p.type] = p.value; });
    return out;
  }
  // Tunisian display format: DD/MM/YYYY HH:MM:SS (24h)
  function tunisiaDisplay(date){
    var p = tunisiaParts(date);
    return p.day + "/" + p.month + "/" + p.year + " " + p.hour + ":" + p.minute + ":" + p.second;
  }
  // Filesystem-safe version for filenames: YYYY-MM-DD_HH-MM-SS
  function tunisiaFileStamp(date){
    var p = tunisiaParts(date);
    return p.year + "-" + p.month + "-" + p.day + "_" + p.hour + "-" + p.minute + "-" + p.second;
  }

  function buildExif(lat, lon, alt, whenDate, refText){
    var GPS = piexif.GPSIFD;
    var gpsIfd = {};
    gpsIfd[GPS.GPSLatitudeRef] = lat >= 0 ? "N" : "S";
    gpsIfd[GPS.GPSLatitude] = toDMS(Math.abs(lat));
    gpsIfd[GPS.GPSLongitudeRef] = lon >= 0 ? "E" : "W";
    gpsIfd[GPS.GPSLongitude] = toDMS(Math.abs(lon));
    if(typeof alt === "number" && !isNaN(alt)){
      gpsIfd[GPS.GPSAltitudeRef] = alt < 0 ? 1 : 0;
      gpsIfd[GPS.GPSAltitude] = [Math.round(Math.abs(alt)*100), 100];
    }
    // EXIF requires "YYYY:MM:DD HH:MM:SS" — filled with Tunisia local time
    // regardless of the device's own timezone setting.
    var p = tunisiaParts(whenDate);
    var dtStr = p.year+":"+p.month+":"+p.day+" "+p.hour+":"+p.minute+":"+p.second;

    var zeroth = {};
    zeroth[piexif.ImageIFD.DateTime] = dtStr;
    if(refText){ zeroth[piexif.ImageIFD.ImageDescription] = "Ref: " + refText; }

    var exif = {};
    exif[piexif.ExifIFD.DateTimeOriginal] = dtStr;

    return { "0th": zeroth, "Exif": exif, "GPS": gpsIfd, "1st": {}, "thumbnail": null };
  }

  // lines: each entry is either a plain string (pure numeric/GPS/timestamp
  // content — always drawn as a single left-to-right run) or an
  // {label, value} pair (a translated word plus a number). For the
  // {label, value} form the label and the number are drawn as two
  // separate fillText calls, positioned by hand, instead of being joined
  // into one string and left to the canvas's own bidi handling — that
  // guarantees the digits in `value` are never reshuffled or mirrored by
  // right-to-left text around them, in Arabic or any future language.
  function drawWatermark(ctx, w, h, lines){
    var pad = Math.max(8, w*0.02);
    var fontSize = Math.max(13, Math.round(w*0.028));
    ctx.font = fontSize + "px monospace";
    var lineH = Math.max(16, Math.round(w*0.034));
    var boxH = lines.length * lineH + pad*1.4;
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.fillRect(0, h - boxH, w, boxH);
    ctx.fillStyle = "#5fe3a1";
    var rtl = (LANG === "ar");
    var gap = fontSize * 0.3;

    lines.forEach(function(line, i){
      var y = h - boxH + pad + (i+0.8)*lineH;
      if(typeof line === "string"){
        // Plain numeric/GPS/timestamp content — no script mixing, so a
        // single run is always safe. Only the anchor side changes with
        // language, to sit flush with the rest of the box's text.
        ctx.textAlign = rtl ? "right" : "left";
        ctx.fillText(line, rtl ? (w - pad) : pad, y);
        return;
      }
      if(rtl){
        ctx.textAlign = "right";
        var x = w - pad;
        ctx.fillText(line.label, x, y);
        x -= ctx.measureText(line.label).width + gap;
        ctx.fillText(":", x, y);
        x -= ctx.measureText(":").width + gap;
        ctx.fillText(line.value, x, y);
      }else{
        ctx.textAlign = "left";
        ctx.fillText(line.label + " " + line.value, pad, y);
      }
    });
    ctx.textAlign = "left";
  }

  // Draws the current video frame and reports whether the result looks like
  // real image data (vs. a stale/black frame, which happens if the video
  // element was paused or hadn't actually started decoding yet).
  function drawFrameAndCheck(ctx, w, h){
    ctx.drawImage(video, 0, 0, w, h);
    var sample = ctx.getImageData(0, 0, w, h);
    var d = sample.data, sum = 0, step = 4 * 97; // sparse sample for speed
    var count = 0;
    for(var i = 0; i < d.length; i += step){
      sum += d[i] + d[i+1] + d[i+2];
      count++;
    }
    return (sum / count) > 3; // near-zero average means an all-black frame
  }

  async function capture(){
    if(!video.videoWidth || !videoReady){ showToast(t("toastCamNotReady")); return; }
    shutterBtn.disabled = true;

    if(video.paused){
      try{ await video.play(); }catch(e){}
    }

    var w, h, ctx, ok = false;

    // Prefer a full-resolution still straight from the sensor — the live
    // preview stream is capped much lower than the camera's actual photo
    // resolution, which is the main reason fine text looked soft.
    var highResBitmap = null;
    if(imageCapture){
      try{
        var blob = await imageCapture.takePhoto();
        highResBitmap = await createImageBitmap(blob);
      }catch(e){ highResBitmap = null; }
    }

    if(highResBitmap){
      w = highResBitmap.width; h = highResBitmap.height;
      canvas.width = w; canvas.height = h;
      ctx = canvas.getContext("2d", { willReadFrequently: true });
      ctx.drawImage(highResBitmap, 0, 0, w, h);
      ok = true;
    }else{
      w = video.videoWidth; h = video.videoHeight;
      canvas.width = w; canvas.height = h;
      ctx = canvas.getContext("2d", { willReadFrequently: true });
      ok = drawFrameAndCheck(ctx, w, h);
      if(!ok){
        // Retry a couple of times with short waits — covers the case where
        // the decoder hadn't produced a real frame yet on the first attempt.
        for(var attempt = 0; attempt < 3 && !ok; attempt++){
          await new Promise(function(r){ setTimeout(r, 200); });
          ok = drawFrameAndCheck(ctx, w, h);
        }
      }
    }

    if(!ok){
      showToast(t("toastFrameBlank"));
      shutterBtn.disabled = false;
      return;
    }

    var when = new Date();
    var ref = refInput.value.trim();
    var lat = null, lon = null, acc = null, alt = null;
    if(lastPosition){
      lat = lastPosition.coords.latitude;
      lon = lastPosition.coords.longitude;
      acc = lastPosition.coords.accuracy;
      alt = lastPosition.coords.altitude;
    }

    var coordStr = (lat!=null) ? (lat.toFixed(6)+", "+lon.toFixed(6)+" ±"+Math.round(acc)+"m") : t("watermarkNoGps");
    var lines = [];
    if(ref) lines.push({ label: t("watermarkRef"), value: ref });
    lines.push(coordStr);
    lines.push(tunisiaDisplay(when));
    drawWatermark(ctx, w, h, lines);

    var dataUrl = canvas.toDataURL("image/jpeg", 0.96);

    if(lat != null){
      try{
        var exifObj = buildExif(lat, lon, alt, when, ref);
        var exifBytes = piexif.dump(exifObj);
        dataUrl = piexif.insert(exifBytes, dataUrl);
      }catch(e){ /* watermark still present even if EXIF write fails */ }
    }

    var id = "p" + Date.now();
    var filename = "fieldmarker_" + (ref ? ref.replace(/[^a-z0-9_-]/gi,"") + "_" : "") +
      tunisiaFileStamp(when) + ".jpg";

    entries.unshift({
      id: id, ref: ref, lat: lat, lon: lon, acc: acc, alt: alt,
      ts: tunisiaDisplay(when), filename: filename, dataUrl: dataUrl
    });
    saveLog();
    renderLog();
    showToast(lat!=null ? t("toastSavedGps") : t("toastSavedNoGps"));

    if(autoInc.checked){
      refInput.value = nextAutoRef();
    }

    setTimeout(function(){ shutterBtn.disabled = false; }, 350);
  }

  function csvEscape(s){
    s = String(s == null ? "" : s);
    if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
    return s;
  }

  function exportCsv(){
    if(!entries.length){ showToast(t("toastNothingExport")); return; }
    var rows = [["reference","latitude","longitude","accuracy_m","altitude_m","timestamp_utc","filename"]];
    entries.slice().reverse().forEach(function(e){
      rows.push([e.ref, e.lat!=null?e.lat:"", e.lon!=null?e.lon:"", e.acc!=null?Math.round(e.acc):"",
        e.alt!=null?Math.round(e.alt):"", e.ts, e.filename]);
    });
    var csv = rows.map(function(r){ return r.map(csvEscape).join(","); }).join("\n");
    var blob = new Blob([csv], {type:"text/csv"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "fieldmarker_log_" + tunisiaFileStamp(new Date()) + ".csv";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  }

  function downloadAll(){
    if(!entries.length){ showToast(t("toastNothingSave")); return; }
    // Mobile browsers block multiple automatic downloads triggered one after
    // another — only the first would go through. Bundling into a single ZIP
    // sidesteps that entirely, since it's just one download.
    if(typeof JSZip === "undefined"){
      showToast(t("toastZipLibFail"));
      return;
    }
    var btn = document.getElementById("downloadAllBtn");
    var originalText = btn.textContent;
    btn.textContent = t("toastZipping")(entries.length);
    btn.disabled = true;

    var zip = new JSZip();
    entries.slice().reverse().forEach(function(e){
      var base64 = e.dataUrl.split(",")[1];
      zip.file(e.filename, base64, { base64: true });
    });

    zip.generateAsync({ type: "blob" }).then(function(blob){
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "fieldmarker_photos_" + tunisiaFileStamp(new Date()) + ".zip";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      showToast(t("toastZipSaved")(entries.length));
    }).catch(function(){
      showToast(t("toastZipFailed"));
    }).finally(function(){
      btn.textContent = originalText;
      btn.disabled = false;
    });
  }

  function clearLog(){
    if(!entries.length) return;
    if(confirm(t("deleteConfirmAll")(entries.length))){
      entries = [];
      renderLog();
      // Fully remove the stored record rather than overwriting it with an
      // empty array, so the space is actually released, not just left as
      // a leftover empty entry taking a sliver of storage.
      if(hasIDB){
        idbDelete(STORE_KEY).catch(function(){ saveLog(); });
      }else{
        try{ localStorage.removeItem(STORE_KEY); }catch(e){}
      }
    }
  }

  // ---------- wire up ----------
  shutterBtn.addEventListener("click", capture);
  document.getElementById("retryGpsBtn").addEventListener("click", startGeo);
  document.getElementById("exportBtn").addEventListener("click", exportCsv);
  document.getElementById("downloadAllBtn").addEventListener("click", downloadAll);
  document.getElementById("clearBtn").addEventListener("click", clearLog);

  loadLog();
  startCamera();
  startGeo();

  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
})();
</script>
</body>
</html>
